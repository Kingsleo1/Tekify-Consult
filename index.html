<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tekify Consult - Global standard digital agency and IT consulting. We transform businesses with AI, Cloud, and Software solutions.">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Custom Favicon -->
    <link rel="icon" href="/api/logo">
    
    <title>Tekify Consult - Global Digital Agency & IT Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              background: {
                light: '#f8fafc', // Slate 50
                dark: '#0f172a', // Slate 900
                darker: '#020617', // Slate 950
              },
              primary: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1', // Indigo
                600: '#4f46e5',
                700: '#4338ca',
              },
              accent: {
                cyan: '#06b6d4',
                purple: '#8b5cf6',
                pink: '#ec4899'
              }
            },
            animation: {
              'blob': 'blob 10s infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'gradient-x': 'gradient-x 15s ease infinite',
              'spin-slow': 'spin 12s linear infinite',
              'marquee': 'marquee 30s linear infinite',
              'marquee-reverse': 'marquee-reverse 30s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              'marquee-reverse': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        @apply bg-background-darker text-slate-100 transition-colors duration-300;
      }
      
      /* Smooth transitions for theme switch */
      *, *::before, *::after {
        transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 200ms;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        @apply bg-transparent;
      }
      ::-webkit-scrollbar-thumb {
        @apply bg-slate-700 rounded-full;
      }
      ::-webkit-scrollbar-thumb:hover {
        @apply bg-slate-600;
      }

      .glass-panel {
        @apply bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-lg;
      }
      
      .text-gradient {
        @apply text-transparent bg-clip-text bg-gradient-to-r from-primary-600 via-accent-purple to-accent-cyan animate-gradient-x;
      }

      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Animated Background Shapes */
      .bg-shape {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        opacity: 0.4;
        animation: float-shape 20s infinite alternate ease-in-out;
      }

      @keyframes float-shape {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        33% { transform: translate(10vw, -10vh) scale(1.2) rotate(120deg); }
        66% { transform: translate(-5vw, 15vh) scale(0.8) rotate(240deg); }
        100% { transform: translate(0, 0) scale(1) rotate(360deg); }
      }

      .shape-1 { width: 40vw; height: 40vw; top: -10%; left: -10%; background: radial-gradient(circle, #6366f1, transparent); }
      .shape-2 { width: 35vw; height: 35vw; top: 20%; right: -10%; background: radial-gradient(circle, #8b5cf6, transparent); animation-delay: -5s; }
      .shape-3 { width: 45vw; height: 45vw; bottom: -10%; left: 20%; background: radial-gradient(circle, #06b6d4, transparent); animation-delay: -10s; }
    </style>
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
